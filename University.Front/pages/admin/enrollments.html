<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Enrollments - Admin</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Admin Panel</h2>
          <p id="adminName">Administrator</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="students.html" class="nav-item">👨‍🎓 Students</a>
          <a href="instructors.html" class="nav-item">👨‍🏫 Instructors</a>
          <a href="departments.html" class="nav-item">🏢 Departments</a>
          <a href="courses.html" class="nav-item">📚 Courses</a>
          <a href="enrollments.html" class="nav-item active">📝 Enrollments</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>Manage Enrollments</h1>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Enrollments List</h2>
          </div>
          <div class="card-body">
            <div class="filter-bar">
              <select id="courseFilter" class="form-control">
                <option value="">All Courses</option>
              </select>
              <select id="statusFilter" class="form-control">
                <option value="">All Status</option>
                <option value="Enrolled">Enrolled</option>
                <option value="Dropped">Dropped</option>
                <option value="Completed">Completed</option>
              </select>
              <button class="btn btn-secondary" onclick="filterEnrollments()">
                Filter
              </button>
            </div>
            <div class="table-container" id="enrollmentsTable">
              <div class="loading">Loading enrollments...</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/admin/enrollments.js"></script>
  </body>
</html>

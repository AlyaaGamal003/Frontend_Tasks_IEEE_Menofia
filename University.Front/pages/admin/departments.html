<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Departments - Admin</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Admin Panel</h2>
          <p id="adminName">Administrator</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="students.html" class="nav-item">👨‍🎓 Students</a>
          <a href="instructors.html" class="nav-item">👨‍🏫 Instructors</a>
          <a href="departments.html" class="nav-item active">🏢 Departments</a>
          <a href="courses.html" class="nav-item">📚 Courses</a>
          <a href="enrollments.html" class="nav-item">📝 Enrollments</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>Manage Departments</h1>
          <button class="btn btn-primary" onclick="openAddDepartmentModal()">
            + Add Department
          </button>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Departments List</h2>
          </div>
          <div class="card-body">
            <div class="table-container" id="departmentsTable">
              <div class="loading">Loading departments...</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Add/Edit Department Modal -->
    <div id="departmentModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Add Department</h3>
          <button class="close-modal" onclick="closeModal('departmentModal')">
            &times;
          </button>
        </div>
        <form id="departmentForm">
          <input type="hidden" id="departmentId" />
          <div class="form-group">
            <label for="name">Department Name *</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="building">Building *</label>
            <input type="text" id="building" required />
          </div>
          <div class="form-group">
            <label for="headId">Department Head</label>
            <select id="headId">
              <option value="">Select Instructor (Optional)</option>
            </select>
          </div>
          <div id="formError" class="error-message" style="display: none"></div>
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">
              Save Department
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal('departmentModal')"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/admin/departments.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Courses - Admin</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Admin Panel</h2>
          <p id="adminName">Administrator</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="students.html" class="nav-item">👨‍🎓 Students</a>
          <a href="instructors.html" class="nav-item">👨‍🏫 Instructors</a>
          <a href="departments.html" class="nav-item">🏢 Departments</a>
          <a href="courses.html" class="nav-item active">📚 Courses</a>
          <a href="enrollments.html" class="nav-item">📝 Enrollments</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>Manage Courses</h1>
          <button class="btn btn-primary" onclick="openAddCourseModal()">
            + Add Course
          </button>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Courses List</h2>
          </div>
          <div class="card-body">
            <div class="filter-bar">
              <input
                type="text"
                id="searchInput"
                placeholder="Search courses..."
                class="form-control"
              />
              <select id="departmentFilter" class="form-control">
                <option value="">All Departments</option>
              </select>
            </div>
            <div class="table-container" id="coursesTable">
              <div class="loading">Loading courses...</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Add/Edit Course Modal -->
    <div id="courseModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Add Course</h3>
          <button class="close-modal" onclick="closeModal('courseModal')">
            &times;
          </button>
        </div>
        <form id="courseForm">
          <input type="hidden" id="courseId" />
          <div class="form-group">
            <label for="courseCode">Course Code *</label>
            <input type="text" id="courseCode" required />
          </div>
          <div class="form-group">
            <label for="name">Course Name *</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="creditHours">Credit Hours *</label>
            <input type="number" id="creditHours" min="1" max="6" required />
          </div>
          <div class="form-group">
            <label for="instructorId">Instructor *</label>
            <select id="instructorId" required>
              <option value="">Select Instructor</option>
            </select>
          </div>
          <div class="form-group">
            <label for="departmentId">Department *</label>
            <select id="departmentId" required>
              <option value="">Select Department</option>
            </select>
          </div>
          <div id="formError" class="error-message" style="display: none"></div>
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">Save Course</button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal('courseModal')"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/admin/courses.js"></script>
  </body>
</html>

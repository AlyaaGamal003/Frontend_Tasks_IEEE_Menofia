<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Instructors - Admin</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Admin Panel</h2>
          <p id="adminName">Administrator</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="students.html" class="nav-item">👨‍🎓 Students</a>
          <a href="instructors.html" class="nav-item active">👨‍🏫 Instructors</a>
          <a href="departments.html" class="nav-item">🏢 Departments</a>
          <a href="courses.html" class="nav-item">📚 Courses</a>
          <a href="enrollments.html" class="nav-item">📝 Enrollments</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>Manage Instructors</h1>
          <button class="btn btn-primary" onclick="openAddInstructorModal()">
            + Add Instructor
          </button>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Instructors List</h2>
          </div>
          <div class="card-body">
            <div class="filter-bar">
              <input
                type="text"
                id="searchInput"
                placeholder="Search by name or email..."
                class="form-control"
              />
              <select id="departmentFilter" class="form-control">
                <option value="">All Departments</option>
              </select>
            </div>
            <div class="table-container" id="instructorsTable">
              <div class="loading">Loading instructors...</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Add/Edit Instructor Modal -->
    <div id="instructorModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Add Instructor</h3>
          <button class="close-modal" onclick="closeModal('instructorModal')">
            &times;
          </button>
        </div>
        <form id="instructorForm">
          <input type="hidden" id="instructorId" />
          <div class="form-group">
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" required />
          </div>
          <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" required />
          </div>
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" required />
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" required />
          </div>
          <div class="form-group" id="passwordGroup">
            <label for="password">Password *</label>
            <input type="password" id="password" />
            <small
              >Min 8 characters, 1 uppercase, 1 lowercase, 1 number, 1 special
              char</small
            >
          </div>
          <div class="form-group">
            <label for="contactNumber">Contact Number *</label>
            <input type="text" id="contactNumber" required />
          </div>
          <div class="form-group">
            <label for="departmentId">Department *</label>
            <select id="departmentId" required>
              <option value="">Select Department</option>
            </select>
          </div>
          <div id="formError" class="error-message" style="display: none"></div>
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">
              Save Instructor
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal('instructorModal')"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/admin/instructors.js"></script>
  </body>
</html>

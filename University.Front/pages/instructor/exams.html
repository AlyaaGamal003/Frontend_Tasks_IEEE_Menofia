<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Exams - Instructor</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Instructor Panel</h2>
          <p id="instructorName">Instructor</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="courses.html" class="nav-item">📚 My Courses</a>
          <a href="exams.html" class="nav-item active">📝 Exams</a>
          <a href="attendance.html" class="nav-item">📅 Attendance</a>
          <a href="profile.html" class="nav-item">👤 Profile</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>Manage Exams</h1>
          <button class="btn btn-primary" onclick="openCreateExamModal()">
            + Create Exam
          </button>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Exams List</h2>
          </div>
          <div class="card-body">
            <div class="filter-bar">
              <select id="courseFilter" class="form-control">
                <option value="">All Courses</option>
              </select>
              <select id="typeFilter" class="form-control">
                <option value="">All Types</option>
                <option value="Midterm">Midterm</option>
                <option value="Final">Final</option>
                <option value="Quiz">Quiz</option>
              </select>
            </div>
            <div class="table-container" id="examsTable">
              <div class="loading">Loading exams...</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Create Exam Modal -->
    <div id="examModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Create Exam</h3>
          <button class="close-modal" onclick="closeModal('examModal')">
            &times;
          </button>
        </div>
        <form id="examForm">
          <div class="form-group">
            <label for="courseId">Course *</label>
            <select id="courseId" required>
              <option value="">Select Course</option>
            </select>
          </div>
          <div class="form-group">
            <label for="title">Exam Title *</label>
            <input type="text" id="title" required />
          </div>
          <div class="form-group">
            <label for="examType">Exam Type *</label>
            <select id="examType" required>
              <option value="">Select Type</option>
              <option value="Midterm">Midterm</option>
              <option value="Final">Final</option>
              <option value="Quiz">Quiz</option>
            </select>
          </div>
          <div class="form-group">
            <label for="scheduledDate">Scheduled Date & Time *</label>
            <input type="datetime-local" id="scheduledDate" required />
          </div>
          <div class="form-group">
            <label for="duration">Duration (minutes) *</label>
            <input type="number" id="duration" min="1" required />
          </div>
          <div class="form-group">
            <label for="totalMarks">Total Marks *</label>
            <input type="number" id="totalMarks" min="1" required />
          </div>
          <div id="formError" class="error-message" style="display: none"></div>
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">Create Exam</button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal('examModal')"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/instructor/exams.js"></script>
  </body>
</html>

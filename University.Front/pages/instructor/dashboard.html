<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instructor Dashboard</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Instructor Panel</h2>
          <p id="instructorName">Instructor</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item active">📊 Dashboard</a>
          <a href="courses.html" class="nav-item">📚 My Courses</a>
          <a href="exams.html" class="nav-item">📝 Exams</a>
          <a href="attendance.html" class="nav-item">📅 Attendance</a>
          <a href="profile.html" class="nav-item">👤 Profile</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>Instructor Dashboard</h1>
          <div class="user-info">
            <span class="user-name" id="userName">Instructor</span>
            <button
              class="btn btn-danger btn-sm"
              onclick="authService.logout()"
            >
              Logout
            </button>
          </div>
        </header>

        <div class="stats-grid" id="statsGrid">
          <div class="stat-card">
            <div class="stat-label">My Courses</div>
            <div class="stat-value" id="totalCourses">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Students</div>
            <div class="stat-value" id="totalStudents">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Exams</div>
            <div class="stat-value" id="totalExams">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Credit Hours</div>
            <div class="stat-value" id="totalCredits">0</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>My Courses</h2>
          </div>
          <div class="card-body" id="coursesList">
            <div class="loading">Loading courses...</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Quick Actions</h2>
          </div>
          <div class="card-body">
            <div class="btn-group">
              <a href="courses.html" class="btn btn-primary">View Courses</a>
              <a href="exams.html" class="btn btn-primary">Manage Exams</a>
              <a href="attendance.html" class="btn btn-primary"
                >Mark Attendance</a
              >
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/instructor/dashboard.js"></script>
  </body>
</html>

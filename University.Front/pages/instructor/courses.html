<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Courses - Instructor</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Instructor Panel</h2>
          <p id="instructorName">Instructor</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="courses.html" class="nav-item active">📚 My Courses</a>
          <a href="exams.html" class="nav-item">📝 Exams</a>
          <a href="attendance.html" class="nav-item">📅 Attendance</a>
          <a href="profile.html" class="nav-item">👤 Profile</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>My Courses</h1>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Courses List</h2>
          </div>
          <div class="card-body">
            <div class="table-container" id="coursesTable">
              <div class="loading">Loading courses...</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Course Details Modal -->
    <div id="courseModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Course Details</h3>
          <button class="close-modal" onclick="closeModal('courseModal')">
            &times;
          </button>
        </div>
        <div id="courseDetails">
          <div class="loading">Loading course details...</div>
        </div>
      </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/instructor/courses.js"></script>
  </body>
</html>

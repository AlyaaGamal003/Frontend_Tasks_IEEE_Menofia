<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark Attendance - Instructor</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Instructor Panel</h2>
          <p id="instructorName">Instructor</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="courses.html" class="nav-item">📚 My Courses</a>
          <a href="exams.html" class="nav-item">📝 Exams</a>
          <a href="attendance.html" class="nav-item active">📅 Attendance</a>
          <a href="profile.html" class="nav-item">👤 Profile</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>Attendance Management</h1>
          <button class="btn btn-primary" onclick="openMarkAttendanceModal()">
            + Mark Attendance
          </button>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Attendance Records</h2>
          </div>
          <div class="card-body">
            <div class="filter-bar">
              <select id="courseFilter" class="form-control">
                <option value="">All Courses</option>
              </select>
              <input type="date" id="dateFrom" class="form-control" />
              <input type="date" id="dateTo" class="form-control" />
              <button class="btn btn-secondary" onclick="filterAttendance()">
                Filter
              </button>
            </div>
            <div class="table-container" id="attendanceTable">
              <div class="loading">Loading attendance records...</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Mark Attendance Modal -->
    <div id="attendanceModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Mark Attendance</h3>
          <button class="close-modal" onclick="closeModal('attendanceModal')">
            &times;
          </button>
        </div>
        <form id="attendanceForm">
          <div class="form-group">
            <label for="courseId">Course *</label>
            <select id="courseId" required onchange="loadStudentsForCourse()">
              <option value="">Select Course</option>
            </select>
          </div>
          <div class="form-group">
            <label for="studentId">Student *</label>
            <select id="studentId" required>
              <option value="">Select Course First</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date">Date *</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" required>
              <option value="Present">Present</option>
              <option value="Absent">Absent</option>
              <option value="Late">Late</option>
              <option value="Excused">Excused</option>
            </select>
          </div>
          <div id="formError" class="error-message" style="display: none"></div>
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">
              Mark Attendance
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal('attendanceModal')"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/instructor/attendance.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Student</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Student Panel</h2>
          <p id="studentName">Student</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="courses.html" class="nav-item">📚 My Courses</a>
          <a href="enrollment.html" class="nav-item">📝 Enroll Courses</a>
          <a href="exams.html" class="nav-item">✏️ Exams</a>
          <a href="attendance.html" class="nav-item">📅 Attendance</a>
          <a href="profile.html" class="nav-item active">👤 Profile</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>My Profile</h1>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Profile Information</h2>
          </div>
          <div class="card-body" id="profileInfo">
            <div class="loading">Loading profile...</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Academic Information</h2>
          </div>
          <div class="card-body" id="academicInfo">
            <div class="loading">Loading academic info...</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Change Password</h2>
          </div>
          <div class="card-body">
            <form id="passwordForm">
              <div class="form-group">
                <label for="currentPassword">Current Password *</label>
                <input type="password" id="currentPassword" required />
              </div>
              <div class="form-group">
                <label for="newPassword">New Password *</label>
                <input type="password" id="newPassword" required />
                <small
                  >Min 8 characters, 1 uppercase, 1 lowercase, 1 number, 1
                  special char</small
                >
              </div>
              <div class="form-group">
                <label for="confirmPassword">Confirm New Password *</label>
                <input type="password" id="confirmPassword" required />
              </div>
              <div
                id="passwordError"
                class="error-message"
                style="display: none"
              ></div>
              <div
                id="passwordSuccess"
                class="success-message"
                style="display: none"
              ></div>
              <button type="submit" class="btn btn-primary">
                Change Password
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/student/profile.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Exams - Student</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Student Panel</h2>
          <p id="studentName">Student</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="courses.html" class="nav-item">📚 My Courses</a>
          <a href="enrollment.html" class="nav-item">📝 Enroll Courses</a>
          <a href="exams.html" class="nav-item active">✏️ Exams</a>
          <a href="attendance.html" class="nav-item">📅 Attendance</a>
          <a href="profile.html" class="nav-item">👤 Profile</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>My Exams</h1>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Available Exams</h2>
          </div>
          <div class="card-body" id="availableExams">
            <div class="loading">Loading exams...</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Exam Results</h2>
          </div>
          <div class="card-body" id="examResults">
            <div class="loading">Loading results...</div>
          </div>
        </div>
      </main>
    </div>

    <!-- Exam Taking Modal -->
    <div id="examModal" class="modal">
      <div class="modal-content" style="max-width: 800px">
        <div class="modal-header">
          <h3 id="examTitle">Exam</h3>
          <div
            id="examTimer"
            class="exam-timer"
            style="position: static; margin-left: auto"
          ></div>
        </div>
        <div id="examQuestions"></div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="submitExam()">
            Submit Exam
          </button>
        </div>
      </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Exam Result</h3>
          <button class="close-modal" onclick="closeModal('resultModal')">
            &times;
          </button>
        </div>
        <div id="resultContent"></div>
      </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/student/exams.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Attendance - Student</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Student Panel</h2>
          <p id="studentName">Student</p>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
          <a href="courses.html" class="nav-item">📚 My Courses</a>
          <a href="enrollment.html" class="nav-item">📝 Enroll Courses</a>
          <a href="exams.html" class="nav-item">✏️ Exams</a>
          <a href="attendance.html" class="nav-item active">📅 Attendance</a>
          <a href="profile.html" class="nav-item">👤 Profile</a>
          <a href="#" class="nav-item" onclick="authService.logout()"
            >🚪 Logout</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>My Attendance</h1>
        </header>

        <div class="card">
          <div class="card-header">
            <h2>Attendance Summary</h2>
          </div>
          <div class="card-body" id="attendanceSummary">
            <div class="loading">Loading attendance summary...</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Attendance History</h2>
          </div>
          <div class="card-body">
            <div class="filter-bar">
              <select id="courseFilter" class="form-control">
                <option value="">All Courses</option>
              </select>
              <select id="statusFilter" class="form-control">
                <option value="">All Status</option>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
                <option value="Late">Late</option>
              </select>
              <button class="btn btn-secondary" onclick="filterAttendance()">
                Filter
              </button>
            </div>
            <div class="table-container" id="attendanceTable">
              <div class="loading">Loading attendance history...</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/student/attendance.js"></script>
  </body>
</html>
